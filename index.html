<!-- =========================================================
     🛒 سلة مشتريات محسّنة - التاج الرقمي
     ضع هذا الجزء قبل </body>
========================================================= -->

<style>

/* =========================
   CART BUTTON
========================= */

.cart-float{
    position:fixed;
    right:12px;
    bottom:170px;
    width:58px;
    height:58px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#9147ff,#ff2d88);
    color:#fff;
    font-size:25px;
    z-index:1600;
    box-shadow:0 10px 35px #0009;
    border:2px solid #ffffff22;
    cursor:pointer;
}

.cart-count{
    position:absolute;
    top:-5px;
    left:-4px;
    min-width:22px;
    height:22px;
    padding:0 5px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#ef4444;
    color:#fff;
    font-size:10px;
    font-weight:1000;
    border:2px solid #060810;
}

/* =========================
   CART OVERLAY
========================= */

.cart-overlay{
    position:fixed;
    inset:0;
    background:#0009;
    backdrop-filter:blur(5px);
    z-index:2000;
    display:none;
}

.cart-overlay.show{
    display:block;
}

/* =========================
   CART PANEL
========================= */

.cart-panel{
    position:fixed;
    top:0;
    right:0;
    width:min(420px,100%);
    height:100vh;
    background:#0b0f19;
    border-left:1px solid #ffffff15;
    z-index:2100;
    transform:translateX(105%);
    transition:.3s ease;
    display:flex;
    flex-direction:column;
    box-shadow:-15px 0 50px #0009;
}

.cart-panel.show{
    transform:translateX(0);
}

.cart-header{
    min-height:70px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ffffff12;
    background:#0e131f;
}

.cart-title{
    display:flex;
    align-items:center;
    gap:9px;
}

.cart-title h2{
    font-size:18px;
    font-weight:1000;
}

.cart-close{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:#ffffff0d;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* =========================
   CART CONTENT
========================= */

.cart-body{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.cart-empty{
    min-height:300px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#9aa6ba;
}

.cart-empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.cart-empty strong{
    color:#fff;
    font-size:16px;
    margin-bottom:6px;
}

.cart-empty span{
    font-size:10px;
}

/* =========================
   CART ITEM
========================= */

.cart-item{
    padding:13px;
    margin-bottom:10px;
    border-radius:17px;
    background:linear-gradient(145deg,#151b29,#0e131e);
    border:1px solid #ffffff10;
}

.cart-item-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-size:13px;
    font-weight:1000;
    color:#fff;
    line-height:1.5;
}

.cart-item-price{
    display:block;
    margin-top:4px;
    color:#ffd166;
    font-size:11px;
    font-weight:900;
}

.cart-delete{
    width:34px;
    height:34px;
    flex-shrink:0;
    border:0;
    border-radius:10px;
    background:#ef44441a;
    color:#ff6b6b;
    cursor:pointer;
    font-size:16px;
}

/* =========================
   QUANTITY
========================= */

.cart-item-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:11px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
}

.quantity button{
    width:30px;
    height:30px;
    border:1px solid #ffffff15;
    border-radius:9px;
    background:#ffffff0d;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.quantity span{
    min-width:25px;
    text-align:center;
    font-size:12px;
    font-weight:1000;
}

.item-total{
    font-size:13px;
    font-weight:1000;
    color:#6ee7b7;
}

/* =========================
   CART FOOTER
========================= */

.cart-footer{
    padding:14px;
    background:#0e131f;
    border-top:1px solid #ffffff12;
}

.cart-total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.cart-total span{
    color:#9aa6ba;
    font-size:11px;
}

.cart-total strong{
    color:#ffd166;
    font-size:19px;
}

.cart-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.cart-action{
    min-height:45px;
    border:0;
    border-radius:13px;
    color:#fff;
    font-size:10px;
    font-weight:1000;
    cursor:pointer;
}

.clear-cart{
    background:#ef44441a;
    border:1px solid #ef444433;
    color:#ff7777;
}

.checkout-cart{
    background:linear-gradient(135deg,#20d879,#079653);
}

.cart-note{
    text-align:center;
    margin-top:9px;
    color:#667085;
    font-size:8px;
    line-height:1.6;
}

/* =========================
   ADD TO CART STATE
========================= */

.added-message{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(20px);
    padding:11px 16px;
    border-radius:13px;
    background:#151c29;
    border:1px solid #16c78455;
    color:#fff;
    font-size:10px;
    font-weight:900;
    opacity:0;
    pointer-events:none;
    z-index:3000;
    transition:.25s;
    box-shadow:0 10px 30px #0008;
}

.added-message.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>


<!-- =========================
     CART BUTTON
========================= -->

<button
    class="cart-float"
    id="cartButton"
    onclick="openCart()"
    aria-label="سلة المشتريات">

    🛒

    <span
        class="cart-count"
        id="cartCount">
        0
    </span>

</button>


<!-- =========================
     CART OVERLAY
========================= -->

<div
    class="cart-overlay"
    id="cartOverlay"
    onclick="closeCart()">
</div>


<!-- =========================
     CART PANEL
========================= -->

<aside
    class="cart-panel"
    id="cartPanel">

    <div class="cart-header">

        <div class="cart-title">
            <span>🛒</span>

            <h2>
                سلة المشتريات
            </h2>
        </div>

        <button
            class="cart-close"
            onclick="closeCart()">
            ×
        </button>

    </div>


    <div
        class="cart-body"
        id="cartBody">

    </div>


    <div class="cart-footer">

        <div class="cart-total">

            <span>
                الإجمالي
            </span>

            <strong id="cartTotal">
                0 د.ع
            </strong>

        </div>


        <div class="cart-actions">

            <button
                class="cart-action clear-cart"
                onclick="clearCart()">
                🗑️ تفريغ السلة
            </button>

            <button
                class="cart-action checkout-cart"
                onclick="checkoutCart()">
                💬 إتمام الطلب
            </button>

        </div>

        <div class="cart-note">
            سيتم إرسال جميع المنتجات الموجودة في السلة إلى واتساب التاج الرقمي.
        </div>

    </div>

</aside>


<!-- رسالة الإضافة -->
<div
    class="added-message"
    id="addedMessage">
    ✅ تمت إضافة المنتج إلى السلة
</div>


<script>

/* =========================================================
   🛒 نظام السلة
========================================================= */

const CART_STORAGE_KEY = "altaj_digital_cart";

const WHATSAPP_NUMBER = "9647756832160";

let cart = [];

try{

    const savedCart =
        localStorage.getItem(CART_STORAGE_KEY);

    cart = savedCart
        ? JSON.parse(savedCart)
        : [];

    if(!Array.isArray(cart)){
        cart = [];
    }

}catch(error){

    cart = [];

}


/* =========================================================
   حفظ السلة
========================================================= */

function saveCart(){

    localStorage.setItem(
        CART_STORAGE_KEY,
        JSON.stringify(cart)
    );

    renderCart();

}


/* =========================================================
   تحويل السعر
========================================================= */

function parsePrice(price){

    if(typeof price === "number"){
        return price;
    }

    if(!price){
        return 0;
    }

    let clean =
        String(price)
        .replace(/[^\d]/g,"");

    return Number(clean) || 0;

}


/* =========================================================
   إضافة منتج
========================================================= */

function addToCart(name, price){

    price = parsePrice(price);

    const existing =
        cart.find(item =>
            item.name === name &&
            item.price === price
        );

    if(existing){

        existing.qty++;

    }else{

        cart.push({

            id:
                Date.now().toString() +
                Math.random().toString(36).slice(2),

            name:name,

            price:price,

            qty:1

        });

    }

    saveCart();

    showAddedMessage();

}


/* =========================================================
   حذف منتج بالكامل
========================================================= */

function removeFromCart(id){

    cart =
        cart.filter(item =>
            item.id !== id
        );

    saveCart();

}


/* =========================================================
   تغيير الكمية
========================================================= */

function changeQuantity(id, amount){

    const item =
        cart.find(x =>
            x.id === id
        );

    if(!item){
        return;
    }

    item.qty += amount;

    if(item.qty <= 0){

        cart =
            cart.filter(x =>
                x.id !== id
            );

    }

    saveCart();

}


/* =========================================================
   تفريغ السلة
========================================================= */

function clearCart(){

    if(cart.length === 0){
        return;
    }

    const confirmClear =
        confirm(
            "هل تريد تفريغ سلة المشتريات بالكامل؟"
        );

    if(!confirmClear){
        return;
    }

    cart = [];

    saveCart();

}


/* =========================================================
   حساب الإجمالي
========================================================= */

function getCartTotal(){

    return cart.reduce(
        (total,item) =>
            total +
            (item.price * item.qty),
        0
    );

}


/* =========================================================
   عدد المنتجات
========================================================= */

function getCartCount(){

    return cart.reduce(
        (total,item) =>
            total + item.qty,
        0
    );

}


/* =========================================================
   تنسيق السعر
========================================================= */

function formatPrice(price){

    return Number(price)
        .toLocaleString("en-US") +
        " د.ع";

}


/* =========================================================
   عرض السلة
========================================================= */

function renderCart(){

    const body =
        document.getElementById("cartBody");

    const count =
        document.getElementById("cartCount");

    const total =
        document.getElementById("cartTotal");


    if(!body){
        return;
    }


    const countNumber =
        getCartCount();

    count.textContent =
        countNumber;


    total.textContent =
        formatPrice(
            getCartTotal()
        );


    if(cart.length === 0){

        body.innerHTML = `

            <div class="cart-empty">

                <div class="cart-empty-icon">
                    🛒
                </div>

                <strong>
                    السلة فارغة
                </strong>

                <span>
                    أضف المنتجات التي تريدها إلى السلة
                </span>

            </div>

        `;

        return;
    }


    body.innerHTML =
        cart.map(item => `

            <div class="cart-item">

                <div class="cart-item-top">

                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${escapeHtml(item.name)}
                        </div>

                        <span class="cart-item-price">
                            ${formatPrice(item.price)}
                        </span>

                    </div>


                    <button
                        class="cart-delete"
                        onclick="removeFromCart('${item.id}')"
                        title="حذف المنتج">

                        🗑️

                    </button>

                </div>


                <div class="cart-item-bottom">

                    <div class="quantity">

                        <button
                            onclick="changeQuantity('${item.id}',-1)">
                            −
                        </button>

                        <span>
                            ${item.qty}
                        </span>

                        <button
                            onclick="changeQuantity('${item.id}',1)">
                            +
                        </button>

                    </div>


                    <div class="item-total">

                        ${formatPrice(
                            item.price * item.qty
                        )}

                    </div>

                </div>

            </div>

        `).join("");

}


/* =========================================================
   حماية النص
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   فتح السلة
========================================================= */

function openCart(){

    document
        .getElementById("cartPanel")
        .classList.add("show");

    document
        .getElementById("cartOverlay")
        .classList.add("show");

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   إغلاق السلة
========================================================= */

function closeCart(){

    document
        .getElementById("cartPanel")
        .classList.remove("show");

    document
        .getElementById("cartOverlay")
        .classList.remove("show");

    document.body.style.overflow =
        "";

}


/* =========================================================
   رسالة الإضافة
========================================================= */

let addedTimer;

function showAddedMessage(){

    const message =
        document.getElementById("addedMessage");

    message.classList.add("show");

    clearTimeout(addedTimer);

    addedTimer =
        setTimeout(
            function(){

                message.classList.remove("show");

            },
            1800
        );

}


/* =========================================================
   إتمام الطلب
========================================================= */

function checkoutCart(){

    if(cart.length === 0){

        alert(
            "🛒 السلة فارغة، أضف منتجاً أولاً."
        );

        return;

    }


    let message =
        "السلام عليكم 👋\n\n" +
        "أريد الطلب من التاج الرقمي:\n\n";


    cart.forEach(
        function(item,index){

            message +=
                "📦 " +
                (index + 1) +
                ". " +
                item.name +
                "\n";

            message +=
                "🔢 الكمية: " +
                item.qty +
                "\n";

            message +=
                "💰 السعر: " +
                formatPrice(
                    item.price * item.qty
                ) +
                "\n\n";

        }
    );


    message +=
        "━━━━━━━━━━━━\n";

    message +=
        "💵 الإجمالي: " +
        formatPrice(
            getCartTotal()
        ) +
        "\n\n";

    message +=
        "يرجى إرسال التفاصيل وطريقة الدفع. شكراً لكم 🌹";


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   دعم زر order القديم
   بدلاً من إرسال المنتج مباشرة إلى واتساب،
   تتم إضافته إلى السلة.
========================================================= */

function order(product){

    /*
       نحاول استخراج السعر من اسم المنتج.
       إذا لم يوجد سعر، يوضع 0 ويظهر
       "السعر عند الطلب" في السلة.
    */

    let price = 0;

    const match =
        String(product).match(
            /(\d[\d,]*)\s*د\.ع/
        );

    if(match){

        price =
            parseInt(
                match[1].replace(/,/g,""),
                10
            ) || 0;

    }


    addToCart(
        product,
        price
    );

}


/* =========================================================
   عند تحميل الصفحة
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderCart();

    }
);


/* =========================================================
   زر ESC لإغلاق السلة
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){
            closeCart();
        }

    }
);

</script>
